[package]
name = "loadpace-rama"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.96"
description = "Rama adapter for adaptive client-side load balancing and backpressure"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/conradludgate/loadpace"
keywords = ["load-balancing", "backpressure", "rama", "congestion-control"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
dns = ["dep:arc-swap", "dep:moka", "rama/dns", "tokio/rt"]

[dependencies]
arc-swap = { version = "1.9", optional = true }
loadpace = { version = "=0.1.0-rc.4", path = "../loadpace" }
moka = { version = "0.12", features = ["future"], optional = true }
rama = { version = "0.4.0", default-features = false, features = ["std"] }
rand = "0.10"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

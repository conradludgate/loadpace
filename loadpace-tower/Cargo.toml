[package]
name = "loadpace-tower"
version = "0.1.0-rc.4"
edition = "2024"
rust-version = "1.85"
description = "Tower adapter for adaptive client-side load balancing and backpressure"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/conradludgate/loadpace"
keywords = ["load-balancing", "backpressure", "tower", "congestion-control"]
categories = ["network-programming", "asynchronous"]

[dependencies]
futures-core = "0.3"
loadpace = { version = "=0.1.0-rc.4", path = "../loadpace" }
pin-project-lite = "0.2"
rand = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tower = { version = "0.5", features = ["discover", "load"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tower = { version = "0.5", features = ["balance", "discover", "load", "util"] }
